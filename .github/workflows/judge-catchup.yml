name: LangTrend Judge Catch-up

# The configured LLM provider's free tier is bounded by a daily quota (resets
# at midnight UTC), which is comfortably enough for one week's worth of papers
# but not always enough to also clear an existing backlog same-day. This
# workflow retries whatever judge_languages.py left pending (any week, newest
# first so the current week is prioritized over older backlog) three times a
# day, 8 hours apart (13:00, 21:00, 05:00 UTC). It shares the "deploy"
# concurrency group with langtrend.yml, so GitHub Actions queues it behind the
# weekly pipeline automatically if they'd otherwise overlap — no need to guess
# how long that pipeline will run. The same group also means these three daily
# triggers queue behind each other rather than running concurrently if one is
# still in progress when the next fires.
#
# Fires every day (including the same day as the weekly pipeline); this is
# intentionally not special-cased around Tuesday, since judge_languages.py's
# gap detection makes a run with nothing pending a fast no-op.
#
# Deploy only requires the current/latest week to be fully judged (same gate
# as langtrend.yml) — it does not wait for the entire historical backlog.
# Each run that finishes more of the backlog redeploys the site, so older
# weeks' pages get progressively more accurate "studied" counts over time
# without blocking on the whole backfill completing first.

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 21 * * *'
    - cron: '0 5 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  judge-catchup:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      fully_judged: ${{ steps.check.outputs.exit_code == '0' }}

    steps:
      # ref: explicit branch name, not the default github.sha — this job waits
      # in the shared "deploy" concurrency queue behind langtrend.yml (often
      # for hours on a Tuesday), and github.sha for a schedule/dispatch event
      # is pinned at trigger time. Without this, checkout would still land on
      # whatever main looked like when this run was queued, missing everything
      # the weekly pipeline committed while this was waiting its turn.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Resumable: already-judged papers are skipped, so this just continues
      # wherever the last run (weekly pipeline or a previous catch-up) left
      # off. Exit 3 (stopped early, e.g. quota exhausted) is expected — quota
      # resets at midnight UTC, so retrying sooner wouldn't help; that case is
      # left for the next scheduled run, same as before.
      #
      # Two different things call for a retry-within-this-run, both worth
      # looping on since a paper that fails leaves no judge_cache file and so
      # comes back as "pending" on the very next invocation — a fresh call is
      # literally what "retry" means here:
      #   - Exit 1: judge_languages.py couldn't even start — client.ping()
      #     raised LLMUnavailableError (network unreachable, or a 5xx from
      #     the endpoint) before a single paper was judged. Everything that
      #     can go wrong once judging is underway already yields 0 or 3
      #     instead.
      #   - Exit 0 with "Failed: N" > 0: judging ran, but some papers'
      #     individual chat() calls errored out (e.g. the endpoint died
      #     partway through a big backlog) — judge_languages.py already
      #     retries each one 3x with its own backoff/fallback-model chain
      #     before giving up on it, logs it as "  ERROR: [id] ...", and
      #     moves on rather than aborting the whole sweep.
      # An auth failure (401/403) is deliberately NOT retried — a bad key
      # won't fix itself by waiting. Otherwise there's no attempt cap: it
      # just keeps rejudging whatever's still pending, with backoff (1/2/4/
      # .../10 min, capped so a long outage still gets re-checked regularly)
      # between passes, until either everything's judged, quota is hit, or a
      # hard 5h50m wall-clock budget for this step runs out — 10 min of the
      # 6h per-job ceiling held back for the steps after this one (check/
      # rebuild-manifest/update-readme/commit), which are fast but still
      # need to run rather than being left to GitHub's own job cancellation
      # to trigger them. Every attempt (the first one included) runs under
      # `timeout`, capped to whatever's left of the budget, so one pass
      # can't blow past the cutoff by itself even if it hangs. This never
      # interrupts a paper's own retries — each judge_languages.py
      # invocation runs its full per-paper retry/fallback-model chain to
      # completion undisturbed; only the budget's edge can cut a pass off
      # mid-run, via SIGTERM (then SIGKILL after 30s if that doesn't land).
      # That's safe because each paper's judge_cache file is written as soon
      # as that paper finishes, so a cutoff only loses in-flight work, not
      # anything already done. Whatever's still pending when this step ends
      # — for any reason — is left for the if: always() steps below to
      # commit, and the 13:00/21:00/05:00 UTC schedule to pick up next time.
      - name: Judge pending papers across every week (LLM)
        id: judge
        env:
          LLM_JUDGE_API_KEY: ${{ secrets.LLM_JUDGE_API_KEY }}
          LLM_JUDGE_BASE_URL: ${{ vars.LLM_JUDGE_BASE_URL }}
          LLM_JUDGE_MODEL: ${{ vars.LLM_JUDGE_MODEL }}
          LLM_JUDGE_FALLBACK_MODELS: ${{ vars.LLM_JUDGE_FALLBACK_MODELS }}
          LLM_JUDGE_RPM: ${{ vars.LLM_JUDGE_RPM }}
          LLM_JUDGE_RPH: ${{ vars.LLM_JUDGE_RPH }}
        run: |
          set +e
          budget_seconds=$((5 * 3600 + 50 * 60))  # 5h50m hard cutoff for this step
          max_delay=600  # cap backoff at 10 min so a long outage still gets re-checked regularly
          step_start=$(date +%s)
          delay=60
          code=0
          : > judge_output.log  # accumulate across attempts (tee -a below) so no attempt's errors are lost
          while true; do
            remaining=$((budget_seconds - ($(date +%s) - step_start)))
            if [ "$remaining" -le 0 ]; then
              echo "Hit the ${budget_seconds}s retry budget — stopping so the save/deploy-gate steps still run before GitHub's 6h job ceiling."
              code=124
              break
            fi

            timeout -k 30s "${remaining}s" python scripts/judge_languages.py --sweep-all-weeks --skip-if-unconfigured 2>&1 | tee -a judge_output.log
            code=${PIPESTATUS[0]}
            failed=$(grep -oE 'Failed: [0-9]+' judge_output.log | tail -1 | grep -oE '[0-9]+' || true)
            failed=${failed:-0}

            if [ "$code" = "124" ]; then
              echo "Judging pass hit the retry budget mid-run — stopping so the save/deploy-gate steps still run."
              break
            fi
            if [ "$code" = "3" ]; then
              break  # quota exhausted / other stop-early — next scheduled run picks it up
            fi
            if [ "$code" = "0" ] && [ "$failed" = "0" ]; then
              break  # fully judged, nothing pending
            fi
            if [ "$code" != "0" ] && [ "$code" != "1" ]; then
              break  # unexpected exit code — don't loop, fail normally
            fi
            if [ "$code" = "1" ] && ! grep -qE 'Error: (Cannot reach|Endpoint error)' judge_output.log; then
              break  # exit 1 for a non-retryable reason (bad args, auth failure)
            fi

            remaining=$((budget_seconds - ($(date +%s) - step_start)))
            if [ "$remaining" -le "$delay" ]; then
              echo "Not enough of the retry budget left for another backoff sleep — stopping so the save/deploy-gate steps still run."
              break
            fi

            echo "Retrying (exit=$code, failed=$failed) in ${delay}s..."
            sleep "$delay"
            delay=$((delay * 2))
            if [ "$delay" -gt "$max_delay" ]; then
              delay=$max_delay
            fi
          done
          set -e
          # Per-paper errors (e.g. a dead/retired model slug returning 404) are
          # caught inside judge_languages.py and don't affect its exit code —
          # only the "Failed: N" summary line reflects them.
          failed=$(grep -oE 'Failed: [0-9]+' judge_output.log | tail -1 | grep -oE '[0-9]+' || true)
          echo "failed_count=${failed:-0}" >> "$GITHUB_OUTPUT"
          # 124 = the retry loop's own 5h50m budget cutoff — a designed, graceful
          # stop (same category as 3/quota-exhausted), not a real failure. Letting
          # it through here would mark this step "failed" and make the Notify
          # step below claim "job FAILED" on exactly the happy path this loop
          # was built for.
          if [ "$code" != "0" ] && [ "$code" != "3" ] && [ "$code" != "124" ]; then
            exit "$code"
          fi

      - name: Notify on judge errors
        if: always() && (steps.judge.outcome == 'failure' || (steps.judge.outputs.failed_count != '0' && steps.judge.outputs.failed_count != ''))
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ steps.judge.outcome }}" = "failure" ]; then
            title="LangTrend judge-catchup job FAILED"
          else
            title="LangTrend judge-catchup: ${{ steps.judge.outputs.failed_count }} paper(s) failed"
          fi
          # One "=== week: N cached, N without targets, N pending ===" line per
          # week tells us exactly what's still outstanding at a glance, without
          # needing to open the run's log. judge_output.log now accumulates
          # across every retry attempt (see the judge step above), and each
          # attempt reprints this line for every week it swept — so dedupe to
          # the last (most current) occurrence per week rather than showing
          # stale counts from an earlier attempt.
          summary=$(tac judge_output.log 2>/dev/null | awk '
            /^=== .+: [0-9]+ cached, [0-9]+ without targets, [0-9]+ pending ===$/ {
              split($0, a, ":")
              if (!(a[1] in seen)) { seen[a[1]] = 1; print }
            }
          ' | tac || true)
          total_pending=$(printf '%s\n' "$summary" | grep -oE '[0-9]+ pending ===$' | awk '{s+=$1} END {print s+0}')
          weeks_with_pending=$(printf '%s\n' "$summary" | grep -oE '[0-9]+ pending ===$' | awk '$1>0{c++} END {print c+0}')
          totals="Total pending: ${total_pending} paper(s) across ${weeks_with_pending} week(s)"
          body=$(printf '%s\n\n%s\n\n%s\n\n%s\n' "$title" "$totals" "$summary" "$run_url")
          if [ -n "${NOTIFY_WEBHOOK_URL:-}" ]; then
            # Push only — email forwarding (X-Email) was removed: ntfy.sh
            # rejects it on anonymous/unreserved topics with HTTP 400
            # ("anonymous email sending is not allowed"), so it never worked.
            # Diagnostics stay visible (status/body) instead of swallowed, in
            # case delivery ever fails for another reason.
            set +e
            http_code=$(curl -sS -X POST -H "Title: ${title}" \
              --data-binary "$body" "$NOTIFY_WEBHOOK_URL" -o /tmp/notify_response.txt -w "%{http_code}")
            curl_exit=$?
            set -e
            echo "notify: curl exit=$curl_exit http_status=$http_code"
            cat /tmp/notify_response.txt 2>/dev/null || true
          fi

      # Same per-week gate as langtrend.yml's judge job — deploy shouldn't
      # wait for the full repo-wide backlog, just the current week. if: always()
      # on this and the two steps below: if the sweep above gets cancelled
      # (this job's 180 min budget), whatever verdicts it produced before that
      # should still be checked/folded in and committed, not silently dropped.
      - name: Check whether the latest week is fully judged
        id: check
        if: always()
        env:
          LLM_JUDGE_API_KEY: ${{ secrets.LLM_JUDGE_API_KEY }}
        run: |
          set +e
          python scripts/judge_languages.py --window-days 7 --check-only
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Rebuild manifests for every week
        if: always()
        run: |
          shopt -s nullglob
          for f in data/raw/extracted_papers_metadata/arxiv_papers_*.jsonl; do
            python scripts/build_manifest.py --input "$f" --window-days 7
          done

      - name: Update README stats and badges
        if: always()
        run: |
          python scripts/update_readme_stats.py --data-root data

      - name: Commit judge catch-up outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          generated_files=(
            data/processed/langtrend_manifest_last_7_days.json
            data/processed/weeks/*/judge_cache/*.json
            data/processed/weeks/*/arxiv_papers_*_judge_warnings.json
            data/processed/weeks/*/langtrend_manifest.json
            data/processed/badges/papers_badge.json
            data/processed/badges/languages_badge.json
            data/processed/weekly_summary.csv
            README.md
          )

          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "No generated files matched any pattern."
            exit 0
          fi

          git add -f "${generated_files[@]}"

          if git diff --cached --quiet; then
            echo "No judge catch-up changes to commit."
            exit 0
          fi

          git commit -m "Judge catch-up: verdicts and manifest update"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase -X ours origin/main
            git push origin HEAD:main
          }

  # Only deploys once the current/latest week has zero pending papers — if
  # that week isn't judged yet, tomorrow's scheduled run tries again. Older
  # weeks keep backfilling in the background across runs regardless. No
  # "result != 'cancelled'" guard — see the equivalent comment in
  # langtrend.yml; fully_judged already comes from an if: always() step, so
  # it alone is sufficient and correctly false whenever judging isn't done.
  deploy:
    needs:
      - judge-catchup
    if: always() && needs.judge-catchup.outputs.fully_judged == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      should_publish: true
      fully_judged: ${{ needs.judge-catchup.outputs.fully_judged == 'true' }}
