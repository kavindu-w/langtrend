name: LangTrend Judge Catch-up

# The configured LLM provider's free tier is bounded by a daily quota (resets
# at midnight UTC), which is comfortably enough for one week's worth of papers
# but not always enough to also clear an existing backlog same-day. This
# workflow retries whatever judge_languages.py left pending (any week, newest
# first so the current week is prioritized over older backlog) once a day. It
# shares the "deploy" concurrency group with langtrend.yml, so GitHub Actions
# queues it behind the weekly pipeline automatically if they'd otherwise
# overlap — no need to guess how long that pipeline will run.
#
# Fires every day (including the same day as the weekly pipeline); this is
# intentionally not special-cased around Tuesday, since judge_languages.py's
# gap detection makes a run with nothing pending a fast no-op.
#
# Deploy only requires the current/latest week to be fully judged (same gate
# as langtrend.yml) — it does not wait for the entire historical backlog.
# Each run that finishes more of the backlog redeploys the site, so older
# weeks' pages get progressively more accurate "studied" counts over time
# without blocking on the whole backfill completing first.

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  judge-catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      fully_judged: ${{ steps.check.outputs.exit_code == '0' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Resumable: already-judged papers are skipped, so this just continues
      # wherever the last run (weekly pipeline or a previous catch-up) left
      # off. Exit 3 (stopped early, e.g. quota exhausted) is expected.
      - name: Judge pending papers across every week (LLM)
        env:
          LLM_JUDGE_API_KEY: ${{ secrets.LLM_JUDGE_API_KEY }}
        run: |
          set +e
          python scripts/judge_languages.py --sweep-all-weeks --skip-if-unconfigured
          code=$?
          set -e
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then
            exit "$code"
          fi

      # Same per-week gate as langtrend.yml's judge job — deploy shouldn't
      # wait for the full repo-wide backlog, just the current week.
      - name: Check whether the latest week is fully judged
        id: check
        env:
          LLM_JUDGE_API_KEY: ${{ secrets.LLM_JUDGE_API_KEY }}
        run: |
          set +e
          python scripts/judge_languages.py --window-days 7 --check-only
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Rebuild manifests for every week
        run: |
          shopt -s nullglob
          for f in data/raw/extracted_papers_metadata/arxiv_papers_*.jsonl; do
            python scripts/build_manifest.py --input "$f" --window-days 7
          done

      - name: Update README stats and badges
        run: |
          python scripts/update_readme_stats.py --data-root data

      - name: Commit judge catch-up outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          generated_files=(
            data/processed/langtrend_manifest_last_7_days.json
            data/processed/weeks/*/judge_cache/*.json
            data/processed/weeks/*/arxiv_papers_*_judge_warnings.json
            data/processed/weeks/*/langtrend_manifest.json
            data/processed/badges/papers_badge.json
            data/processed/badges/languages_badge.json
            data/processed/weekly_summary.csv
            README.md
          )

          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "No generated files matched any pattern."
            exit 0
          fi

          git add -f "${generated_files[@]}"

          if git diff --cached --quiet; then
            echo "No judge catch-up changes to commit."
            exit 0
          fi

          git commit -m "Judge catch-up: verdicts and manifest update"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase -X ours origin/main
            git push origin HEAD:main
          }

  # Only deploys once the current/latest week has zero pending papers — if
  # that week isn't judged yet, tomorrow's scheduled run tries again. Older
  # weeks keep backfilling in the background across runs regardless.
  deploy:
    needs:
      - judge-catchup
    if: always() && needs.judge-catchup.result != 'cancelled' && needs.judge-catchup.outputs.fully_judged == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      should_publish: true
