name: Build and deploy site (reusable)

# Called by langtrend.yml (after the weekly judge job) and judge-catchup.yml
# (after the daily catch-up job), whichever one clears the judging backlog
# first. Builds the Astro site from whatever data/ state is committed at
# call time and deploys to GitHub Pages.
#
# Note: github.event_name inside a called workflow is always 'workflow_call',
# not the caller's original trigger — so the caller must tell us explicitly
# whether this run should actually publish (see the should_publish input).

on:
  workflow_call:
    inputs:
      should_publish:
        description: 'Actually configure/upload/deploy Pages (false = build only, for manual dry runs)'
        required: false
        default: true
        type: boolean
      fully_judged:
        description: >-
          Whether this run reached deploy via the caller's per-week judge gate
          (true) rather than a deploy-only bypass (deploy_only dispatch input
          or a [deploy-only] commit tag), where judging status this run is
          unverified. Doesn't affect whether Pages deploys, but does gate
          two things: the "site is live" notification wording, and whether
          the weekly email digest is created (only for a fully judged week).
          Defaults to false so a caller that forgets to pass it never emails
          subscribers.
        required: false
        default: false
        type: boolean
    secrets:
      NOTIFY_WEBHOOK_URL:
        description: >-
          ntfy.sh topic URL for the "site is live" push. Must be declared here
          for callers to pass it explicitly; a reusable workflow gets no
          secrets from its caller otherwise. Optional — the notify step below
          no-ops when it's empty, so a fork without the secret still deploys.
        required: false
      BUTTONDOWN_API_KEY:
        description: >-
          Buttondown API key for the weekly email digest. Optional — the digest
          step is skipped when it's empty. Only ever used to *create* an email;
          the script never reads the subscriber list.
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        env:
          # Repo Actions *variable* (not a secret — it ends up in the public
          # page source anyway). Unset = no visitor tracking/counter.
          PUBLIC_GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          # Also a variable: the newsletter's public username. Unset = no
          # signup form or footer link.
          PUBLIC_BUTTONDOWN_USERNAME: ${{ vars.BUTTONDOWN_USERNAME }}
        run: npm run build

      - name: Configure Pages
        if: inputs.should_publish
        uses: actions/configure-pages@v5

      # Publishes the commit this build was made from, so judge-catchup.yml can
      # tell whether the live site is behind main. The deployments API can't
      # answer that: it records the run's trigger-time github.sha, not what was
      # checked out and built — a catch-up run that commits verdicts and then
      # deploys them gets recorded under the commit *before* its own push.
      - name: Record the deployed commit
        if: inputs.should_publish
        run: git rev-parse HEAD > web/dist/deploy-sha.txt

      - name: Upload Pages artifact
        if: inputs.should_publish
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deploy
        if: inputs.should_publish
        uses: actions/deploy-pages@v4

      # Fires on any real publish. Wording depends on inputs.fully_judged:
      # true only when this run reached deploy via the caller's per-week judge
      # gate (not a deploy-only bypass, where judging status is unverified).
      - name: Notify that the site is live
        if: inputs.should_publish
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          title="LangTrend - Site is Live and Up-to-Date"
          if [ "${{ inputs.fully_judged }}" = "true" ]; then
            status_line="This week fully judged and deployed: ${{ steps.deploy.outputs.page_url }}"
          else
            status_line="Site deployed via a deploy-only run (judging status not verified this run): ${{ steps.deploy.outputs.page_url }}"
          fi
          # README's "Latest Run Summary" table (regenerated by
          # update_readme_stats.py, committed by the judge job before this
          # deploy runs) — pull it verbatim between its markers.
          stats=$(awk '/<!-- LANGTREND_STATS_START -->/{flag=1; next} /<!-- LANGTREND_STATS_END -->/{flag=0} flag' README.md 2>/dev/null || true)
          body=$(printf '%s\n\n%s\n' "$status_line" "$stats")
          if [ -n "${NOTIFY_WEBHOOK_URL:-}" ]; then
            # Markdown: yes — the stats block above is raw Markdown (a table,
            # bold, a blockquote); without this ntfy sends it as literal text.
            # Push only — email forwarding (X-Email) was removed: ntfy.sh
            # rejects it on anonymous/unreserved topics with HTTP 400
            # ("anonymous email sending is not allowed"), so it never worked.
            # Diagnostics stay visible (status/body) instead of swallowed, in
            # case delivery ever fails for another reason.
            set +e
            http_code=$(curl -sS -X POST -H "Title: ${title}" -H "Markdown: yes" \
              --data-binary "$body" "$NOTIFY_WEBHOOK_URL" -o /tmp/notify_response.txt -w "%{http_code}")
            curl_exit=$?
            set -e
            echo "notify: curl exit=$curl_exit http_status=$http_code"
            cat /tmp/notify_response.txt 2>/dev/null || true
          fi

      # Weekly email digest. Only after a real publish of a fully judged week,
      # so the email's links point at a live page with final verdicts. Safe to
      # run on every such deploy (daily catch-ups included): send_digest.py
      # does nothing if this week's digest already exists in Buttondown.
      # DIGEST_MODE (repo variable): "draft" (default) leaves it for review in
      # Buttondown; "send" sends it straight away; "off" skips the step.
      # Duplicates are detected by exact subject, so to skip one week, leave
      # its draft unsent in Buttondown rather than deleting or renaming it —
      # otherwise the next daily catch-up deploy recreates it.
      #
      # The site is already live by now, so a digest failure (Buttondown down,
      # key revoked) must not turn the run red: continue-on-error, plus its
      # own push alert below.
      - name: Set up Python (digest)
        if: inputs.should_publish && inputs.fully_judged && vars.DIGEST_MODE != 'off'
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Create weekly email digest
        id: digest
        if: inputs.should_publish && inputs.fully_judged && vars.DIGEST_MODE != 'off'
        continue-on-error: true
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          DIGEST_MODE: ${{ vars.DIGEST_MODE || 'draft' }}
        run: |
          # tee would otherwise mask send_digest.py's exit code.
          set -o pipefail
          if [ -z "${BUTTONDOWN_API_KEY:-}" ]; then
            echo "BUTTONDOWN_API_KEY not set - skipping digest"
            exit 0
          fi
          # Standard library only (langtrend/__init__ imports lazily), so no
          # pip install — none of the torch/docling stack.
          python scripts/send_digest.py --mode "$DIGEST_MODE" \
            --site-url "${{ steps.deploy.outputs.page_url || 'https://kavindu-w.github.io/langtrend' }}" \
            2>&1 | tee digest_output.log

      - name: Notify on digest failure
        if: steps.digest.outcome == 'failure'
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          [ -n "${NOTIFY_WEBHOOK_URL:-}" ] || exit 0
          errors=$(grep '^ERROR:' digest_output.log 2>/dev/null || true)
          body=$(printf 'The site deployed, but the weekly email digest failed. Nothing was sent to subscribers.\n\n%s\n\nRun: %s/%s/actions/runs/%s' \
            "${errors:-see the run log}" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          set +e
          http_code=$(curl -sS -X POST -H "Title: LangTrend - Email digest failed" -H "Priority: high" \
            --data-binary "$body" "$NOTIFY_WEBHOOK_URL" -o /tmp/notify_response.txt -w "%{http_code}")
          curl_exit=$?
          set -e
          echo "notify: curl exit=$curl_exit http_status=$http_code"
          cat /tmp/notify_response.txt 2>/dev/null || true

      - name: Upload snapshot artifact (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: langtrend-snapshot-${{ github.run_id }}
          path: |
            data/processed/langtrend_manifest_last_7_days.json
            data/processed/langtrend_manifest_*_to_*.json
          retention-days: 30
