name: LangTrend Snapshot

on:
  # Every Tuesday at 12:00 UTC — arXiv's Mon 20:00 ET announcement (covering
  # Fri–Mon submissions) completes ~Tue 00:00 UTC; noon gives the API time to
  # fully index before we harvest via OAI-PMH.
  schedule:
    - cron: '0 12 * * 2'
  # Also trigger on manual dispatch and on pushes to main for code changes
  workflow_dispatch:
    inputs:
      publish_site:
        description: 'Deploy to GitHub Pages after building'
        required: false
        default: false
        type: boolean
      major_version_update:
        description: 'Use a major version bump instead of a patch bump'
        required: false
        default: false
        type: boolean
      deploy_only:
        description: 'Skip paper processing — build and deploy frontend only'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'langtrend/**'
      - 'scripts/**'
      - 'web/**'
      - 'web/package-lock.json'
      - 'requirements.txt'
      - '.python-version'
      - '.github/workflows/langtrend.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Job 1: fetch paper metadata + HTML text extraction (~1-3 h, I/O-bound)
# Commits partial results before timeout so Job 2 can continue from where
# it left off. timeout-minutes: 350 leaves ~10 min inside GitHub's 6 h
# runner cap for the if: always() commit step to complete reliably.
# ---------------------------------------------------------------------------
jobs:
  fetch-and-html:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || !inputs.deploy_only
    timeout-minutes: 350
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # run_langtrend_pipeline auto-skips fetch if this week's JSONL already exists
      - name: Fetch papers from arXiv
        run: |
          python scripts/run_langtrend_pipeline.py \
            --data-root data \
            --window-days 7 \
            --max-results 1000 \
            --skip-process

      # Commit the JSONL immediately so it is preserved even if the HTML pass times out.
      # continue-on-error: a push failure here is non-fatal — the JSONL will be
      # committed later by "Commit HTML pass outputs" and the HTML pass must still run.
      - name: Commit fetched paper list
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          fetched=(data/raw/extracted_papers_metadata/arxiv_papers_*.jsonl)
          echo "JSONL files found: ${#fetched[@]}"
          for f in "${fetched[@]}"; do echo "  $f"; done
          if [ ${#fetched[@]} -eq 0 ]; then
            echo "No JSONL found to commit."
            exit 0
          fi
          git add -f "${fetched[@]}"
          if git diff --cached --quiet; then
            echo "No new paper data to commit — file already in repo."
            exit 0
          fi
          git commit -m "Add fetched paper list"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase -X ours origin/main
            git push origin HEAD:main
          }

      # HTML-only pass — fast, no docling, saturate I/O threads
      - name: Run LangTrend pipeline (HTML pass)
        run: |
          python scripts/run_langtrend_pipeline.py \
            --data-root data \
            --window-days 7 \
            --max-results 1000 \
            --workers 24 \
            --skip-fetch \
            --no-pdf

      # Commit HTML outputs so pdf-and-deploy picks them up via a fresh checkout.
      # --retry-missing uses the committed detected/no_detections files to skip
      # papers already processed here, so it only runs docling on true PDF cases.
      # continue-on-error: if this push fails after retrying, Job 1 still succeeds
      # so Job 2 runs (it will just reprocess more papers via --retry-missing).
      - name: Commit HTML pass outputs
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          generated_files=(
            data/raw/extracted_papers_metadata/arxiv_papers_*.jsonl
            data/processed/language_screening_warnings.json
            data/processed/langtrend_manifest_last_7_days.json
            data/processed/weeks/*/arxiv_papers_*_detected.jsonl
            data/processed/weeks/*/arxiv_papers_*_no_detections.json
            data/processed/weeks/*/arxiv_papers_*_warnings.json
            data/processed/weeks/*/langtrend_manifest.json
          )

          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "No generated files matched any pattern."
            exit 0
          fi

          git add -f "${generated_files[@]}"

          if git diff --cached --quiet; then
            echo "No HTML pass changes to commit."
            exit 0
          fi

          git commit -m "Update HTML pass outputs"
          # If remote moved ahead (Job 1's JSONL commit), rebase our outputs on top.
          # -X ours resolves any manifest conflicts by keeping our freshly-generated files.
          git push origin HEAD:main || {
            git fetch origin main
            git rebase -X ours origin/main
            git push origin HEAD:main
          }

# ---------------------------------------------------------------------------
# Job 2: HTML continuation — retries papers Job 1 didn't reach before its
# timeout. Same no-PDF pass; picks up unprocessed papers via --retry-missing.
# ---------------------------------------------------------------------------
  fetch-and-html-2:
    needs:
      - fetch-and-html
    if: always() && needs.fetch-and-html.result != 'cancelled' && (github.event_name != 'workflow_dispatch' || !inputs.deploy_only)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LangTrend pipeline (HTML continuation)
        run: |
          python scripts/run_langtrend_pipeline.py \
            --data-root data \
            --window-days 7 \
            --max-results 1000 \
            --workers 24 \
            --skip-fetch \
            --no-pdf \
            --retry-missing

      - name: Commit HTML continuation outputs
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          generated_files=(
            data/processed/language_screening_warnings.json
            data/processed/langtrend_manifest_last_7_days.json
            data/processed/weeks/*/arxiv_papers_*_detected.jsonl
            data/processed/weeks/*/arxiv_papers_*_no_detections.json
            data/processed/weeks/*/arxiv_papers_*_warnings.json
            data/processed/weeks/*/langtrend_manifest.json
          )

          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "No generated files matched any pattern."
            exit 0
          fi

          git add -f "${generated_files[@]}"

          if git diff --cached --quiet; then
            echo "No HTML continuation changes to commit."
            exit 0
          fi

          git commit -m "Update HTML pass outputs (continuation)"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase -X ours origin/main
            git push origin HEAD:main
          }

# ---------------------------------------------------------------------------
# Job 3: PDF retry (~1-4 h, CPU-bound docling)
# Fresh checkout sees all HTML outputs committed by Jobs 1–2.
# ---------------------------------------------------------------------------
  pdf-retry:
    needs:
      - fetch-and-html-2
    if: always() && needs.fetch-and-html-2.result != 'cancelled' && (github.event_name != 'workflow_dispatch' || !inputs.deploy_only)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      # Bump version while the working tree is clean (no data files modified yet).
      # Running this after PDF processing causes autostash conflicts on manifest files.
      - name: Bump product version
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          current_version=$(tr -d '[:space:]' < VERSION)
          major=${current_version%%.*}
          minor_patch=${current_version#*.}
          minor=${minor_patch%%.*}
          patch=${current_version##*.}

          if [[ -z "$major" || -z "$minor" || -z "$patch" ]]; then
            echo "VERSION must use semantic versioning like 0.1.0"
            exit 1
          fi

          if echo "${{ github.event.head_commit.message }}" | grep -qF '[major]'; then
            major=$((major + 1))
            new_version="$major.0.0"
          else
            patch=$((patch + 1))
            new_version="$major.$minor.$patch"
          fi

          printf '%s\n' "$new_version" > VERSION
          git add VERSION
          git commit -m "Bump version to $new_version"
          git push origin HEAD:main || {
            git pull --rebase origin main
            git push origin HEAD:main
          }

          git tag "v$new_version"
          git push origin "v$new_version"
          gh release create "v$new_version" --title "v$new_version" --generate-notes

      - name: Bump product version (major)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_site && inputs.major_version_update && !inputs.deploy_only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          current_version=$(tr -d '[:space:]' < VERSION)
          major=${current_version%%.*}
          minor_patch=${current_version#*.}
          minor=${minor_patch%%.*}
          patch=${current_version##*.}

          if [[ -z "$major" || -z "$minor" || -z "$patch" ]]; then
            echo "VERSION must use semantic versioning like 0.1.0"
            exit 1
          fi

          major=$((major + 1))
          new_version="$major.0.0"

          printf '%s\n' "$new_version" > VERSION
          git add VERSION
          git commit -m "Bump version to $new_version"
          git push origin HEAD:main || {
            git pull --rebase origin main
            git push origin HEAD:main
          }

          git tag "v$new_version"
          git push origin "v$new_version"
          gh release create "v$new_version" --title "v$new_version" --generate-notes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LangTrend pipeline (PDF retry)
        run: |
          python scripts/run_langtrend_pipeline.py \
            --data-root data \
            --window-days 7 \
            --max-results 1000 \
            --workers 6 \
            --skip-fetch \
            --retry-missing

      - name: Commit PDF retry outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          generated_files=(
            data/processed/language_screening_warnings.json
            data/processed/langtrend_manifest_last_7_days.json
            data/processed/weeks/*/arxiv_papers_*_detected.jsonl
            data/processed/weeks/*/arxiv_papers_*_no_detections.json
            data/processed/weeks/*/arxiv_papers_*_warnings.json
            data/processed/weeks/*/langtrend_manifest.json
          )

          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "No generated files matched any pattern."
            exit 0
          fi

          git add -f "${generated_files[@]}"

          if git diff --cached --quiet; then
            echo "No PDF retry changes to commit."
            exit 0
          fi

          git commit -m "Update processed weekly outputs"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase -X ours origin/main
            git push origin HEAD:main
          }

# ---------------------------------------------------------------------------
# Job 4: PDF continuation — retries any papers Job 3 didn't reach before
# its timeout. Picks up remaining no_detections via --retry-missing.
# ---------------------------------------------------------------------------
  pdf-retry-2:
    needs:
      - pdf-retry
    if: always() && needs.pdf-retry.result != 'cancelled' && (github.event_name != 'workflow_dispatch' || !inputs.deploy_only)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LangTrend pipeline (PDF continuation)
        run: |
          python scripts/run_langtrend_pipeline.py \
            --data-root data \
            --window-days 7 \
            --max-results 1000 \
            --workers 6 \
            --skip-fetch \
            --retry-missing

      - name: Update README stats and badges
        if: always()
        run: |
          python scripts/update_readme_stats.py --data-root data

      - name: Commit PDF continuation outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          generated_files=(
            data/processed/language_screening_warnings.json
            data/processed/langtrend_manifest_last_7_days.json
            data/processed/weeks/*/arxiv_papers_*_detected.jsonl
            data/processed/weeks/*/arxiv_papers_*_no_detections.json
            data/processed/weeks/*/arxiv_papers_*_warnings.json
            data/processed/weeks/*/langtrend_manifest.json
            data/processed/badges/papers_badge.json
            data/processed/badges/languages_badge.json
            README.md
          )

          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "No generated files matched any pattern."
            exit 0
          fi

          git add -f "${generated_files[@]}"

          if git diff --cached --quiet; then
            echo "No PDF continuation changes to commit."
            exit 0
          fi

          git commit -m "Update processed weekly outputs (continuation)"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase -X ours origin/main
            git push origin HEAD:main
          }

# ---------------------------------------------------------------------------
# Job 5: build frontend + deploy to GitHub Pages (~variable, grows with data)
# Fresh checkout sees all outputs committed by Jobs 1–4.
# ---------------------------------------------------------------------------
  build-and-deploy:
    needs:
      - pdf-retry-2
    if: always() && needs.pdf-retry-2.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Configure Pages
        if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_site)
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deploy
        if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_site)
        uses: actions/deploy-pages@v4

      - name: Upload snapshot artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: langtrend-snapshot-${{ github.run_id }}
          path: |
            data/processed/langtrend_manifest_last_7_days.json
            data/processed/langtrend_manifest_*_to_*.json
          retention-days: 30
