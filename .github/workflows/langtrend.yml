name: LangTrend Snapshot

on:
  # Every Tuesday at 12:00 UTC — arXiv's Mon 20:00 ET announcement (covering
  # Fri–Mon submissions) completes ~Tue 00:00 UTC; noon gives the API time to
  # fully index before we harvest via OAI-PMH.
  schedule:
    - cron: '0 12 * * 2'
  # Also trigger on manual dispatch and on pushes to main for code changes
  workflow_dispatch:
    inputs:
      publish_site:
        description: 'Deploy to GitHub Pages after building'
        required: false
        default: false
        type: boolean
      version_bump:
        description: 'Version bump type for this deploy'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      deploy_only:
        description: 'Skip paper processing — build and deploy frontend only'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'langtrend/**'
      - 'scripts/**'
      - 'web/**'
      - 'web/package-lock.json'
      - 'requirements.txt'
      - '.python-version'
      - '.github/workflows/langtrend.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Job 1: fetch paper metadata + HTML text extraction (~1-3 h, I/O-bound)
# Commits partial results before timeout so Job 2 can continue from where
# it left off. timeout-minutes: 350 leaves ~10 min inside GitHub's 6 h
# runner cap for the if: always() commit step to complete reliably.
# ---------------------------------------------------------------------------
jobs:
  fetch-and-html:
    runs-on: ubuntu-latest
    if: (github.event_name != 'workflow_dispatch' || !inputs.deploy_only) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-only]'))
    timeout-minutes: 350
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # run_langtrend_pipeline auto-skips fetch if this week's JSONL already exists
      - name: Fetch papers from arXiv
        run: |
          python scripts/run_langtrend_pipeline.py \
            --data-root data \
            --window-days 7 \
            --max-results 1000 \
            --skip-process

      # Commit the JSONL immediately so it is preserved even if the HTML pass times out.
      # continue-on-error: a push failure here is non-fatal — the JSONL will be
      # committed later by "Commit HTML pass outputs" and the HTML pass must still run.
      - name: Commit fetched paper list
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          fetched=(data/raw/extracted_papers_metadata/arxiv_papers_*.jsonl)
          echo "JSONL files found: ${#fetched[@]}"
          for f in "${fetched[@]}"; do echo "  $f"; done
          if [ ${#fetched[@]} -eq 0 ]; then
            echo "No JSONL found to commit."
            exit 0
          fi
          git add -f "${fetched[@]}"
          if git diff --cached --quiet; then
            echo "No new paper data to commit — file already in repo."
            exit 0
          fi
          git commit -m "Add fetched paper list"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase -X ours origin/main
            git push origin HEAD:main
          }

      # HTML-only pass — fast, no docling, saturate I/O threads
      - name: Run LangTrend pipeline (HTML pass)
        run: |
          python scripts/run_langtrend_pipeline.py \
            --data-root data \
            --window-days 7 \
            --max-results 1000 \
            --workers 24 \
            --skip-fetch \
            --no-pdf

      # Commit HTML outputs so pdf-and-deploy picks them up via a fresh checkout.
      # --retry-missing uses the committed detected/no_detections files to skip
      # papers already processed here, so it only runs docling on true PDF cases.
      # continue-on-error: if this push fails after retrying, Job 1 still succeeds
      # so Job 2 runs (it will just reprocess more papers via --retry-missing).
      - name: Commit HTML pass outputs
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          generated_files=(
            data/raw/extracted_papers_metadata/arxiv_papers_*.jsonl
            data/processed/language_screening_warnings.json
            data/processed/langtrend_manifest_last_7_days.json
            data/processed/weeks/*/arxiv_papers_*_detected.jsonl
            data/processed/weeks/*/arxiv_papers_*_no_detections.json
            data/processed/weeks/*/arxiv_papers_*_warnings.json
            data/processed/weeks/*/langtrend_manifest.json
          )

          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "No generated files matched any pattern."
            exit 0
          fi

          git add -f "${generated_files[@]}"

          if git diff --cached --quiet; then
            echo "No HTML pass changes to commit."
            exit 0
          fi

          git commit -m "Update HTML pass outputs"
          # If remote moved ahead (Job 1's JSONL commit), rebase our outputs on top.
          # -X ours resolves any manifest conflicts by keeping our freshly-generated files.
          git push origin HEAD:main || {
            git fetch origin main
            git rebase -X ours origin/main
            git push origin HEAD:main
          }

# ---------------------------------------------------------------------------
# Job 2: HTML continuation — retries papers Job 1 didn't reach before its
# timeout. Same no-PDF pass; picks up unprocessed papers via --retry-missing.
# ---------------------------------------------------------------------------
  fetch-and-html-2:
    needs:
      - fetch-and-html
    if: always() && needs.fetch-and-html.result != 'cancelled' && (github.event_name != 'workflow_dispatch' || !inputs.deploy_only) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-only]'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LangTrend pipeline (HTML continuation)
        run: |
          python scripts/run_langtrend_pipeline.py \
            --data-root data \
            --window-days 7 \
            --max-results 1000 \
            --workers 24 \
            --skip-fetch \
            --no-pdf \
            --retry-missing

      - name: Commit HTML continuation outputs
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          generated_files=(
            data/processed/language_screening_warnings.json
            data/processed/langtrend_manifest_last_7_days.json
            data/processed/weeks/*/arxiv_papers_*_detected.jsonl
            data/processed/weeks/*/arxiv_papers_*_no_detections.json
            data/processed/weeks/*/arxiv_papers_*_warnings.json
            data/processed/weeks/*/langtrend_manifest.json
          )

          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "No generated files matched any pattern."
            exit 0
          fi

          git add -f "${generated_files[@]}"

          if git diff --cached --quiet; then
            echo "No HTML continuation changes to commit."
            exit 0
          fi

          git commit -m "Update HTML pass outputs (continuation)"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase -X ours origin/main
            git push origin HEAD:main
          }

# ---------------------------------------------------------------------------
# Job 3: PDF retry (~1-4 h, CPU-bound docling)
# Fresh checkout sees all HTML outputs committed by Jobs 1–2.
# ---------------------------------------------------------------------------
  pdf-retry:
    needs:
      - fetch-and-html-2
    if: always() && needs.fetch-and-html-2.result != 'cancelled' && (github.event_name != 'workflow_dispatch' || !inputs.deploy_only) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-only]'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LangTrend pipeline (PDF retry)
        run: |
          python scripts/run_langtrend_pipeline.py \
            --data-root data \
            --window-days 7 \
            --max-results 1000 \
            --workers 6 \
            --skip-fetch \
            --retry-missing

      - name: Commit PDF retry outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          generated_files=(
            data/processed/language_screening_warnings.json
            data/processed/langtrend_manifest_last_7_days.json
            data/processed/weeks/*/arxiv_papers_*_detected.jsonl
            data/processed/weeks/*/arxiv_papers_*_no_detections.json
            data/processed/weeks/*/arxiv_papers_*_warnings.json
            data/processed/weeks/*/langtrend_manifest.json
          )

          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "No generated files matched any pattern."
            exit 0
          fi

          git add -f "${generated_files[@]}"

          if git diff --cached --quiet; then
            echo "No PDF retry changes to commit."
            exit 0
          fi

          git commit -m "Update processed weekly outputs"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase -X ours origin/main
            git push origin HEAD:main
          }

# ---------------------------------------------------------------------------
# Job 4: PDF continuation — retries any papers Job 3 didn't reach before
# its timeout. Picks up remaining no_detections via --retry-missing.
# ---------------------------------------------------------------------------
  pdf-retry-2:
    needs:
      - pdf-retry
    if: always() && needs.pdf-retry.result != 'cancelled' && (github.event_name != 'workflow_dispatch' || !inputs.deploy_only) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-only]'))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LangTrend pipeline (PDF continuation)
        run: |
          python scripts/run_langtrend_pipeline.py \
            --data-root data \
            --window-days 7 \
            --max-results 1000 \
            --workers 6 \
            --skip-fetch \
            --retry-missing

      - name: Update README stats and badges
        if: always()
        run: |
          python scripts/update_readme_stats.py --data-root data

      - name: Commit PDF continuation outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          generated_files=(
            data/processed/language_screening_warnings.json
            data/processed/langtrend_manifest_last_7_days.json
            data/processed/weeks/*/arxiv_papers_*_detected.jsonl
            data/processed/weeks/*/arxiv_papers_*_no_detections.json
            data/processed/weeks/*/arxiv_papers_*_warnings.json
            data/processed/weeks/*/langtrend_manifest.json
            data/processed/badges/papers_badge.json
            data/processed/badges/languages_badge.json
            data/processed/weekly_summary.csv
            README.md
          )

          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "No generated files matched any pattern."
            exit 0
          fi

          git add -f "${generated_files[@]}"

          if git diff --cached --quiet; then
            echo "No PDF continuation changes to commit."
            exit 0
          fi

          git commit -m "Update processed weekly outputs (continuation)"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase -X ours origin/main
            git push origin HEAD:main
          }

# ---------------------------------------------------------------------------
# Job 5: LLM judge — verify this week's detected languages (studied /
# mentioned_only / false_positive) and fold verdicts into the manifest.
# Skips cleanly when the LLM_JUDGE_API_KEY secret is unset (forks), leaving
# detections unjudged. On free-tier rate limits, judge_languages.py stops
# cleanly (exit 3) rather than failing. Bounded by the provider's RPM/RPH, not
# GitHub's 6 h cap, so a first pass alone may not clear a big week — Job 6
# continues it the same day before falling back to judge-catchup.yml's daily
# sweep, which only matters once the provider's actual daily quota is spent.
# ---------------------------------------------------------------------------
  judge:
    needs:
      - pdf-retry-2
    if: always() && needs.pdf-retry-2.result != 'cancelled' && (github.event_name != 'workflow_dispatch' || !inputs.deploy_only) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-only]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Resumable: papers with cached verdicts are skipped, so a re-run after a
      # rate-limit stop or timeout picks up where it left off. Exit 3 (stopped
      # early, e.g. daily quota exhausted) is expected and must not fail the
      # job — only a real error (exit 1) should.
      - name: Judge this week's detected languages (LLM)
        env:
          LLM_JUDGE_API_KEY: ${{ secrets.LLM_JUDGE_API_KEY }}
        run: |
          set +e
          python scripts/judge_languages.py --window-days 7 --skip-if-unconfigured
          code=$?
          set -e
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then
            exit "$code"
          fi

      # Fold whatever verdicts landed this pass into the manifest so partial
      # progress is visible even if Job 6 doesn't finish the rest.
      - name: Rebuild manifest with judge verdicts
        run: |
          python scripts/run_langtrend_pipeline.py \
            --data-root data \
            --window-days 7 \
            --skip-fetch \
            --skip-process

      - name: Commit judge outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          generated_files=(
            data/processed/langtrend_manifest_last_7_days.json
            data/processed/weeks/*/judge_cache/*.json
            data/processed/weeks/*/arxiv_papers_*_judge_warnings.json
            data/processed/weeks/*/langtrend_manifest.json
          )

          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "No generated files matched any pattern."
            exit 0
          fi

          git add -f "${generated_files[@]}"

          if git diff --cached --quiet; then
            echo "No judge changes to commit."
            exit 0
          fi

          git commit -m "Add LLM judge verdicts and update manifest"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase -X ours origin/main
            git push origin HEAD:main
          }

# ---------------------------------------------------------------------------
# Job 6: judge continuation — same RPM/RPH-throttled pass again, picking up
# wherever Job 5's own 120 min budget left off (cached verdicts are skipped).
# This is the pair's "finishing" job: it also runs the repo's per-week deploy
# check, rebuilds the manifest once more, and updates README stats/badges —
# mirroring how pdf-retry-2 finalizes after pdf-retry's first pass. Only the
# current/latest week gates the deploy below — older weeks backfill in the
# background via judge-catchup.yml and redeploy on their own once they catch
# up, so we don't hold the whole site hostage to a multi-day backlog just to
# publish this week's numbers. If even two passes don't clear this week (e.g.
# the provider's actual daily quota, not just GitHub's runner time, is spent),
# judge-catchup.yml tries again once the quota resets.
# ---------------------------------------------------------------------------
  judge-retry:
    needs:
      - judge
    if: always() && needs.judge.result != 'cancelled' && (github.event_name != 'workflow_dispatch' || !inputs.deploy_only) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-only]'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      fully_judged: ${{ steps.check.outputs.exit_code == '0' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Judge this week's detected languages (LLM continuation)
        env:
          LLM_JUDGE_API_KEY: ${{ secrets.LLM_JUDGE_API_KEY }}
        run: |
          set +e
          python scripts/judge_languages.py --window-days 7 --skip-if-unconfigured
          code=$?
          set -e
          if [ "$code" != "0" ] && [ "$code" != "3" ]; then
            exit "$code"
          fi

      - name: Check whether the latest week is fully judged
        id: check
        env:
          LLM_JUDGE_API_KEY: ${{ secrets.LLM_JUDGE_API_KEY }}
        run: |
          set +e
          python scripts/judge_languages.py --window-days 7 --check-only
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Rebuild manifest with judge verdicts
        run: |
          python scripts/run_langtrend_pipeline.py \
            --data-root data \
            --window-days 7 \
            --skip-fetch \
            --skip-process

      - name: Update README stats and badges
        run: |
          python scripts/update_readme_stats.py --data-root data

      - name: Commit judge continuation outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob
          generated_files=(
            data/processed/langtrend_manifest_last_7_days.json
            data/processed/weeks/*/judge_cache/*.json
            data/processed/weeks/*/arxiv_papers_*_judge_warnings.json
            data/processed/weeks/*/langtrend_manifest.json
            data/processed/badges/papers_badge.json
            data/processed/badges/languages_badge.json
            data/processed/weekly_summary.csv
            README.md
          )

          if [ ${#generated_files[@]} -eq 0 ]; then
            echo "No generated files matched any pattern."
            exit 0
          fi

          git add -f "${generated_files[@]}"

          if git diff --cached --quiet; then
            echo "No judge continuation changes to commit."
            exit 0
          fi

          git commit -m "Add LLM judge verdicts and update manifest (continuation)"
          git push origin HEAD:main || {
            git fetch origin main
            git rebase -X ours origin/main
            git push origin HEAD:main
          }

# ---------------------------------------------------------------------------
# Job: bump VERSION — every non-bot push (patch by default, minor/major with
# [minor]/[major] in the commit message), or a manual version_bump dispatch
# choice. Standalone (no needs) so deploy_only / [deploy-only] never skip it.
# ---------------------------------------------------------------------------
  version-bump:
    if: |
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_site && inputs.version_bump != 'none')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Standalone job (no needs) so it always runs regardless of deploy_only /
      # [deploy-only], which skip paper processing but should not skip this.
      - name: Bump product version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          current_version=$(tr -d '[:space:]' < VERSION)
          major=${current_version%%.*}
          minor_patch=${current_version#*.}
          minor=${minor_patch%%.*}
          patch=${current_version##*.}

          if [[ -z "$major" || -z "$minor" || -z "$patch" ]]; then
            echo "VERSION must use semantic versioning like 0.1.0"
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            bump_type="${{ inputs.version_bump }}"
          elif echo "${{ github.event.head_commit.message }}" | grep -qF '[major]'; then
            bump_type="major"
          elif echo "${{ github.event.head_commit.message }}" | grep -qF '[minor]'; then
            bump_type="minor"
          else
            bump_type="patch"
          fi

          case "$bump_type" in
            major)
              major=$((major + 1))
              new_version="$major.0.0"
              ;;
            minor)
              minor=$((minor + 1))
              new_version="$major.$minor.0"
              ;;
            *)
              patch=$((patch + 1))
              new_version="$major.$minor.$patch"
              ;;
          esac

          printf '%s\n' "$new_version" > VERSION
          git add VERSION
          git commit -m "Bump version to $new_version"
          git push origin HEAD:main || {
            git pull --rebase origin main
            git push origin HEAD:main
          }

          git tag "v$new_version"
          git push origin "v$new_version"
          gh release create "v$new_version" --title "v$new_version" --generate-notes

# ---------------------------------------------------------------------------
# Job 7: build frontend + deploy to GitHub Pages (~variable, grows with data)
# Fresh checkout sees all outputs committed by Jobs 1–6. Runs when judge-retry
# confirmed the current/latest week has zero pending papers, or when this run
# skipped paper processing entirely (deploy_only / [deploy-only]) — older
# weeks may still have a backlog, cleared in the background by
# judge-catchup.yml, which redeploys on its own once each week catches up.
# ---------------------------------------------------------------------------
  deploy:
    needs:
      - judge-retry
    if: always() && needs.judge-retry.result != 'cancelled' && (needs.judge-retry.outputs.fully_judged == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_only) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-only]')))
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      should_publish: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_site) }}
